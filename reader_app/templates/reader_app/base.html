<!-- base.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        <link rel="icon" href="data:,">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        {% block head_extra %}
        {% endblock head_extra %}
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <!-- Блок поиска (слева) -->
                <div class="col-2">
                    <div class="mt-3">
                        <h5>Поиск по библиотеке</h5>
                        <form id="searchForm">
                            <div class="mb-2">
                                <input type="text" id="searchInput" class="form-control" placeholder="Введите поисковый запрос..." autocomplete="off">
                            </div>
                        </form>
                        
                        <!-- Контейнер для результатов поиска -->
                        <div id="searchResults" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
                                <h6>Результаты поиска</h6>
                                <button type="button" class="btn-close" id="closeResults" aria-label="Close"></button>
                            </div>
                            <div id="resultsList"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Основной контент (справа) -->
                <div class="col">
                    {% block content %}
                    {% endblock content %}
                </div>
            </div>
        </div>
        
        <script>
            const searchInput = document.getElementById('searchInput');
            const resultsDiv = document.getElementById('searchResults');
            const resultsList = document.getElementById('resultsList');
            const closeResultsBtn = document.getElementById('closeResults');
            
            let debounceTimer;
            

            // Закрытие результатов
            if (closeResultsBtn) {
                closeResultsBtn.addEventListener('click', () => {
                    resultsDiv.style.display = 'none';
                    searchInput.value = '';
                    resultsList.innerHTML = '';
                });
            }
            
            // Функция поиска
            async function performSearch(query) {
                if (!query) {
                    resultsDiv.style.display = 'none';
                    return;
                }
                
                try {
                    console.log('Отправка запроса:', query);
                    const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.results.length > 0) {
                        resultsList.innerHTML = `
                            <ul class="list-group">
                                ${data.results.map(result => `
                                    <a href="/book/${result.book_id}/chapter/${result.chapter_id}" class="list-group-item list-group-item-action">
                                        <h6>${result.title}</h6>
                                    </a>
                                `).join('')}
                            </ul>
                        `;
                        resultsDiv.style.display = 'block';
                    } else {
                        resultsList.innerHTML = '<div>Ничего не найдено</div>';
                        resultsDiv.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    resultsList.innerHTML = '<div>Ошибка поиска</div>';
                    resultsDiv.style.display = 'block';
                }
            }
            
            // Обработчик ввода с debounce
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                
                // Очищаем предыдущий таймер
                clearTimeout(debounceTimer);
                
                // Если запрос пустой, сразу скрываем
                if (!query) {
                    resultsDiv.style.display = 'none';
                    return;
                }
                
                // Устанавливаем новый таймер - запрос отправится через 500 мс
                debounceTimer = setTimeout(() => {
                    performSearch(query);
                }, 500);
            });
        </script>
    </body>
</html>
